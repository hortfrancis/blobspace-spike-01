<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blobspace</title>
    <style>
      html, body { margin: 0; height: 100%; background: #faf6ef; overflow: hidden; }
      canvas { display: block; }

      /* The CSS2D layer sits over the canvas and must not eat clicks. */
      #labels { position: absolute; top: 0; left: 0; pointer-events: none; }

      /* Hangs below a figure's feet. */
      .name {
        margin-top: 10px;
        font: 600 13px/1 system-ui, sans-serif;
        color: #2a2620;
        background: rgb(255 255 255 / 0.75);
        padding: 3px 6px;
        border-radius: 4px;
        white-space: nowrap;
      }

      /* One spoken character. The size is also in src/speech.js, which needs
         it to space letters. */
      .glyph {
        display: block;
        font: 600 22px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #101014;
        white-space: pre;
      }

      /* The prompt over the lamp when it is in reach, from 06. */
      .prompt {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 5px 11px 5px 5px;
        background: #101014;
        border-radius: 999px;
        font: 600 12px/1 system-ui, sans-serif;
        color: #fff;
        white-space: nowrap;
      }

      .key {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        padding-bottom: 1px;
        background: #fff;
        border-radius: 5px;
        font-size: 14px;
        line-height: 1;
        color: #101014;
      }

      #status, #hint {
        position: fixed;
        left: 16px;
        margin: 0;
        font: 500 14px/1.3 system-ui, sans-serif;
        color: #9a9081;
      }
      #status { top: 16px; }
      #hint { bottom: 16px; }
    </style>
  </head>
  <body>
    <p id="status">booting</p>
    <p id="hint">Arrow keys to walk. Type to speak, and there is no backspace. Enter by the lamp to switch it. Open this page in another tab to add a second person.</p>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

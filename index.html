<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blobspace</title>
    <style>
      html, body { margin: 0; height: 100%; background: #faf6ef; overflow: hidden; }
      canvas { display: block; }

      /* The CSS2D layer sits over the canvas and must not eat clicks. */
      #labels { position: absolute; top: 0; left: 0; pointer-events: none; }

      .name {
        font: 600 13px/1 system-ui, sans-serif;
        color: #2a2620;
        background: rgb(255 255 255 / 0.75);
        padding: 3px 6px;
        border-radius: 4px;
        white-space: nowrap;
      }

      #status, #hint {
        position: fixed;
        left: 16px;
        margin: 0;
        font: 500 14px/1.3 system-ui, sans-serif;
        color: #9a9081;
      }
      #status { top: 16px; }
      #hint { bottom: 16px; }
    </style>
  </head>
  <body>
    <p id="status">booting</p>
    <p id="hint">Arrow keys to walk. Open this page in another tab to add a second person.</p>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
